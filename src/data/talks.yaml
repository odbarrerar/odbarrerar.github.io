# ──────────────────────────────────────────────────────────────────────────
#  TALKS, SEMINARS & CONFERENCES
#
#  To add a talk, copy an entry, paste it at the top and edit it.
#
#  Required:  year, event, city, country, type
#  Optional:  date / end_date (YYYY-MM-DD; used to mark upcoming events),
#             month (1–12, when only the month is known),
#             host, url (event page), online (true/false), paper (the file
#             name of a paper in src/content/research, without .md),
#             slides (link), note
#
#  type is one of: Conference, Seminar, Workshop, Webinar, Lecture, Meeting
#  Entries with a date in the future are shown as "Upcoming".
# ──────────────────────────────────────────────────────────────────────────

