- title: German news experiment — experimental news website
  kind: code
  repo: odbarrerar/germannews_zew
  url: https://github.com/odbarrerar/germannews_zew
  paper: biased-information-biased-preferences
  context: Media experiment in Germany with Lora Pavlova and Li Yang (ZEW Mannheim).
  description: >-
    Static front end of a mock news portal ("The Latest German News!") with category
    filtering and headline search, built for the German news experiment.
  languages: [HTML, CSS, JavaScript]
  availability: Source code of the experimental interface. No data are included.

