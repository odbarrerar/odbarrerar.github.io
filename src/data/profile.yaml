# Biography shown on the About page. Separate paragraphs with a blank line.
bio: |
  I am a Senior Research Fellow at University College Dublin's School of Politics and International Relations (SPIRe), where I work on Democracy Challenged, a project funded by a European Research Council Consolidator Grant. I am also a Research Fellow at the World Inequality Lab in Paris.

  My research sits at the intersection of political economy and public economics, and draws on behavioural economics to study social inequality, disinformation and political cleavages. Much of this work relies on survey and field experiments: how voters respond to "alternative facts" and to fact-checking, how information about the income sources of the top 1 percent shapes attitudes toward the rich, and whether text messages to parents improve early childhood development in rural Nicaragua. My current work examines corporate tax avoidance, market power and the concentration of wealth among the largest corporate groups.

  I earned my Ph.D. in Economics (2020) and a Master's in Public Policy and Development (2014) from the Paris School of Economics, after an MA in Economic Development and Growth at Universidad Carlos III de Madrid and undergraduate studies at the Universidad Nacional de Colombia. Before joining UCD, I was a postdoctoral researcher at CY Cergy Paris Université (THEMA/CNRS) and an economist working on migration at CEPII in Paris.

